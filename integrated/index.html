<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:#F0E68C;                /* 卡其色 khaki */
    font-family:"SimSun","宋體","NSimSun",serif;
    font-size:38pt;
    color:#000;
    display:flex;flex-direction:column;align-items:center;
    padding-top:7vh;
    text-align:center;
  }
  h1{
    margin:0 24px;
    font-size:38pt;font-weight:700;
    color:#000;

  }
  /* CUHK Anthropology Dept logo, links to department site */
  .dept-link{
    display:block;line-height:0;margin:0 0 6vh;
  }
  .dept-link .logo-box{
    display:inline-block;background:#fff;border-radius:6px;padding:14px 22px;
    box-shadow:0 4px 12px rgba(0,0,0,.22);
  }
  .dept-link img{height:170px;display:block}
  .dept-link:hover .logo-box{box-shadow:0 6px 16px rgba(0,0,0,.32)}
  .menu{
    display:flex;gap:48px;
    margin-top:9vh;
    flex-wrap:wrap;justify-content:center;
    padding:0 24px;
  }
  .menu a{
    display:flex;align-items:center;justify-content:center;
    width:330px;max-width:70vw;min-height:160px;
    background:#4E342E;                 /* 深啡色 */
    color:#fff;
    text-decoration:none;
    font-size:32pt;
    line-height:1.3;
    border:2px solid #3E2723;
    border-radius:0;                    /* 四方框 */
    padding:16px 28px;
    box-shadow:0 4px 12px rgba(0,0,0,.28);
    transition:background .15s;
  }
  .menu a:hover{background:#5D4037}
  .menu a:active{background:#3E2723}
  @media (max-width:1100px){
    .menu{gap:36px;margin-top:7vh}
    .menu a{min-height:190px}
  }
  @media (max-width:720px){
    body{padding-top:9vh}
    .menu{gap:30px;margin-top:6vh}
    .menu a{min-height:140px}
  }
  /* decorative side images: B21P36 photo (left) + field-note scan (right) */
  .deco{
    position:fixed;top:0;bottom:0;width:24vw;max-width:330px;
    pointer-events:none;z-index:0;
    opacity:0;animation:decoFade 2.2s ease-out .3s forwards;  /* 漸增半透明 */
  }
  .deco img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .deco-left{left:0;
    -webkit-mask-image:linear-gradient(to right,#000 30%,transparent 100%);
            mask-image:linear-gradient(to right,#000 30%,transparent 100%);
  }
  .deco-right{right:0;
    -webkit-mask-image:linear-gradient(to left,#000 30%,transparent 100%);
            mask-image:linear-gradient(to left,#000 30%,transparent 100%);
  }
  @keyframes decoFade{from{opacity:0}to{opacity:.45}}
  @media (max-width:1100px){.deco{display:none}}
  .center-col{position:relative;z-index:1}
